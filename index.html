<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d261c" />
    <meta name="description" content="Mi Tierrita SIG: sistema de información gerencial y de apoyo a la decisión de Agropecuaria Mi Tierrita (Sahagún, Córdoba)." />
    <link rel="icon" href="/favicon.svg" />
    <title>Mi Tierrita SIG</title>
    <!-- Aplica el tema antes de pintar para evitar el destello blanco en modo oscuro. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("mi-tierrita-theme");
          var mode = raw ? (JSON.parse(raw).state || {}).mode : "system";
          var dark = mode === "dark" || ((mode === "system" || !mode) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <style>html[data-theme="dark"] body { background: #0b0c0d; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
